# field_mappings.yaml
# Maps raw source column names → canonical snake_case field names.
# Used by canonicalize.py to rename columns before type casting.
# Keys are source names; values are {raw_col: canonical_col} dicts.
# Only columns we actually use are listed — extras are dropped.

assessor:
  # From c49d-89sn (locations)
  pin:                          pin
  property_address:             address
  property_city:                city
  property_zip:                 zip_code
  latitude:                     latitude
  longitude:                    longitude
  mailing_address:              owner_mailing_address
  mailing_city:                 owner_mailing_city
  mailing_state:                owner_mailing_state
  mailing_zip:                  owner_mailing_zip
  township_name:                township_name
  nbhd:                         neighborhood_code
  # From bcnq-qi2z (characteristics)
  class:                        property_class
  tax_year:                     tax_year
  town_code:                    township_code
  beds:                         num_bedrooms
  fbath:                        num_bathrooms
  rooms:                        num_rooms
  bldg_sf:                      building_sq_ft
  hd_sf:                        land_sq_ft
  age:                          building_age
  garage_indicator:             garage_indicator
  pri_est_bldg:                 assessed_value_building
  pri_est_land:                 assessed_value_land
  total_units:                  total_units
  # From wvhk-k5uv (sales — pivoted)
  sale_date_1:                  sale_date_1
  sale_price_1:                 sale_price_1
  sale_date_2:                  sale_date_2
  sale_price_2:                 sale_price_2
  sale_date_3:                  sale_date_3
  sale_price_3:                 sale_price_3
  deed_type_1:                  deed_type

