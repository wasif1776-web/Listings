# scoring_weights.yaml
# Defines all 10 propensity scoring models.
# Each model is a list of signal definitions:
#   signal:    feature column name
#   condition: comparison string evaluated against the column value
#              supports: >=, <=, >, <, ==, !=, between (inclusive range), high, low
#   points:    integer points awarded when condition is true (additive)
#
# "high" / "low" conditions are evaluated relative to the ZIP 60610
# distribution (above/below the 75th / 25th percentile respectively).
# Percentile thresholds are computed at scoring time from the full parcel universe.
#
# All models are loaded and applied by src/scoring/engine.py.

likely_to_sell:
  - signal: years_owned
    condition: ">= 7"
    points: 15
  - signal: years_owned
    condition: ">= 15"
    points: 10
  - signal: estimated_equity_pct
    condition: ">= 0.40"
    points: 15
  - signal: tax_delinquency_flag
    condition: "== True"
    points: 20
  - signal: absentee_owner_flag
